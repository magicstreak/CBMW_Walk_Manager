      <h1 id="page-title">CBMW Walk Library</h1>
      <p id="page-subtitle"></p>
    </header>

    <div id="picker-wrap" class="picker-bar" hidden>
      <label for="leader-email" class="muted">I am</label>
      <input id="leader-email" type="email" placeholder="Your email address" aria-label="Your email address" autocomplete="email" />
      <span id="picker-msg" class="muted" aria-live="polite" hidden></span>
    </div>

    <main class="panel">
      <div class="toolbar">
        <div class="toolbar-group">
          <input type="search" id="search" placeholder="Search walk ID, route, pueblo or grade" aria-label="Search walks" />
          <select id="leader-filter" aria-label="Filter by leader" hidden></select>
          <select id="grade-filter" aria-label="Filter by grade">
            <option value="">All grades</option>
            <option value="E">E</option>
            <option value="M">M</option>
            <option value="MS">MS</option>
            <option value="S">S</option>
            <option value="VS">VS</option>
          </select>
        </div>
        <div class="toolbar-group" role="group" aria-label="Show walks as">
          <button type="button" class="btn view-btn" data-walks-view="table" aria-pressed="true">List</button>
          <button type="button" class="btn view-btn" data-walks-view="map" aria-pressed="false">Map</button>
        </div>
        <div class="toolbar-group">
          <button type="button" class="btn btn-primary" id="add-walk" hidden>+ Add walk</button>
          <button type="button" class="btn btn-primary" id="request-new-walk" hidden>+ Request new walk</button>
        </div>
      </div>

      <section class="card" id="pending-panel" hidden>
        <h2>Change requests waiting for approval <span class="muted" id="pending-count"></span></h2>
        <div id="pending-list"></div>
      </section>

      <section class="card" id="my-requests-panel" hidden>
        <details class="my-requests" open>
          <summary><h2 id="my-requests-title">My change requests</h2></summary>
          <div id="my-requests-list"></div>
        </details>
      </section>

      <div class="table-wrap">
        <table class="walks-table">
          <thead>
            <tr>
              <th class="chev-cell"><span class="sr-only">Details</span></th>
              <th class="sortable col-id" data-sort="id" tabindex="0" aria-sort="ascending">Walk ID <span class="sort-indicator">↑</span></th>
              <th class="sortable" data-sort="route" tabindex="0">Route <span class="sort-indicator">↕</span></th>
              <th class="sortable col-pueblo" data-sort="pueblo" tabindex="0">Pueblo <span class="sort-indicator">↕</span></th>
              <th class="sortable" data-sort="grade" tabindex="0">Grade <span class="sort-indicator">↕</span></th>
              <th class="sortable" data-sort="distance" tabindex="0">Distance <span class="sort-indicator">↕</span></th>
              <th class="sortable" data-sort="ascent" tabindex="0">Ascent <span class="sort-indicator">↕</span></th>
              <th class="sortable" data-sort="time" tabindex="0">Total time <span class="sort-indicator">↕</span></th>
              <th class="sortable col-owner" data-sort="owner" tabindex="0">Owner <span class="sort-indicator">↕</span></th>
              <th class="photo-cell">Photo</th>
              <th id="actions-head" hidden>Actions</th>
            </tr>
          </thead>
          <tbody id="walks-body"></tbody>
        </table>
      </div>
      <p class="empty" id="empty-note" hidden>No walks match the current filters.</p>
      <section class="walks-map-panel" id="walks-map-panel" hidden>
        <p class="muted" id="walks-map-note" aria-live="polite"></p>
        <div id="walks-map" role="region" aria-label="Map of walk locations"></div>
      </section>
    </main>
  </div>

  <!-- Walk card popup, opened by clicking a walk row (same structure as the scheduler's walk card) -->
  <div class="detail-overlay" id="walk-overlay">
    <div class="detail-card walk-card-wrap" id="walk-card" role="dialog" aria-modal="true" aria-labelledby="detail-title"></div>
  </div>

  <!-- Add / edit / request-change dialog -->
  <div class="modal" id="walk-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p class="lede" id="modal-lede"></p>
      <form id="walk-form" novalidate>
        <div class="form-grid" id="form-fields"></div>
        <p class="form-error" id="form-error" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./js/CBMW-Walks-Database.js"></script>
</body>

</html>
